<!DOCTYPE html>
<html>

<head>

    <title>Contact - REPTILIA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="page-container">


    <div class="page-heading">

        <p class="label">
            GET IN TOUCH
        </p>

        <h1>
            CONTACT US
        </h1>

        <p>
            Punya pertanyaan? Hubungi kami.
        </p>

    </div>


    <div class="contact-layout">


        <div class="contact-info">

            <h2>
                LET'S TALK.
            </h2>

            <p>
                Kami siap membantu kamu
                menemukan kebutuhan yang sesuai
                untuk reptil.
            </p>


            <div class="contact-item">

                <strong>EMAIL</strong>

                <p>
                    reptilia@petsuplies.com
                </p>

            </div>


            <div class="contact-item">

                <strong>PHONE</strong>

                <p>
                    +62 812 3456 7890
                </p>

            </div>


            <div class="contact-item">

                <strong>LOCATION</strong>

                <p>
                    Bandung, Indonesia
                </p>

            </div>

        </div>


        <div class="contact-form">

            <form>

                <label>
                    NAME
                </label>

                <input
                    type="text"
                    placeholder="Your name">


                <label>
                    EMAIL
                </label>

                <input
                    type="email"
                    placeholder="Your email">


                <label>
                    MESSAGE
                </label>

                <textarea
                    rows="6"
                    placeholder="Write your message">
                </textarea>


                <button type="submit">
                    SEND MESSAGE
                </button>

            </form>

        </div>


    </div>

</div>

</body>

</html>
